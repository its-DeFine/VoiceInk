name: Build VoiceInk 2.13 security patch

on:
  push:
    branches:
      - security/v2.13-zip-cve-local-20261025

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify bounded source changes
        shell: bash
        run: |
          set -euo pipefail
          base=68b871e79e2b1ec4c3b4914cccd2e0907d94237a
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/build-v2.13-security.yml \
            VoiceInk.xcodeproj/project.pbxproj \
            VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            | sort)"
          test "$actual" = "$expected"

      - name: Restore pinned Whisper framework
        id: whisper-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: voiceink-whisper-306c88f4d1286aec1bf96e544632897886af5501-xcode-26.3-v1

      - name: Resolve dependencies and prepare pinned Whisper
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt" 2>&1
          grep -q 'Xcode 26.3' "$RUNNER_TEMP/xcode-version.txt"
          swiftc --version > "$RUNNER_TEMP/swift-version.txt" 2>&1
          grep -q 'Swift version 6.3' "$RUNNER_TEMP/swift-version.txt"
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          grep -q -- '-skipMacroValidation' "$RUNNER_TEMP/xcodebuild-help.txt"
          grep -q -- '-onlyUsePackageVersionsFromResolvedFile' "$RUNNER_TEMP/xcodebuild-help.txt"
          grep -q -- '-disableAutomaticPackageResolution' "$RUNNER_TEMP/xcodebuild-help.txt"
          derived="$RUNNER_TEMP/VoiceInkDerivedData"
          xcodebuild \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -derivedDataPath "$derived"
          test "$(git -C "$derived/SourcePackages/checkouts/Zip" rev-parse HEAD)" = \
            bca30f6d6c7d37cbc4aa8f6b0002e281dcc36195
          test "$(git -C "$derived/SourcePackages/checkouts/mlx-swift" rev-parse HEAD)" = \
            0bb916c67f4b9e5c682cbe02a42c701c93ab5021

          whisper_root="$HOME/VoiceInk-Dependencies/whisper.cpp"
          whisper_build="$whisper_root/build-apple"
          whisper_framework="$whisper_build/whisper.xcframework"
          whisper_commit=306c88f4d1286aec1bf96e544632897886af5501
          if [[ ! -d "$whisper_framework" ]]; then
            mkdir -p "$(dirname "$whisper_root")"
            git clone --quiet --depth 1 --branch v1.9.2 \
              https://github.com/ggml-org/whisper.cpp.git "$whisper_root"
            test "$(git -C "$whisper_root" rev-parse HEAD)" = "$whisper_commit"
            (cd "$whisper_root" && ./build-xcframework.sh)
            printf '%s\n' "$whisper_commit" > "$whisper_build/VOICEINK_SOURCE_COMMIT"
          fi
          test -d "$whisper_framework"
          test "$(cat "$whisper_build/VOICEINK_SOURCE_COMMIT")" = "$whisper_commit"

      - name: Save pinned Whisper framework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Build local arm64 app
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/VoiceInkDerivedData"
          xcodebuild \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -derivedDataPath "$derived" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/VoiceInk/VoiceInk.local.entitlements" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) LOCAL_BUILD' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            build

          app="$derived/Build/Products/Debug/VoiceInk.app"
          test -d "$app"
          test "$(git -C "$derived/SourcePackages/checkouts/Zip" rev-parse HEAD)" = \
            bca30f6d6c7d37cbc4aa8f6b0002e281dcc36195
          file "$app/Contents/MacOS/VoiceInk" | grep -q 'arm64'
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" \
            | grep -qx '2.13'
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "$RUNNER_TEMP/VoiceInk-v2.13-zip-security-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/VoiceInk-v2.13-zip-security-arm64.zip" \
            | tee "$RUNNER_TEMP/VoiceInk-v2.13-zip-security-arm64.zip.sha256"

      - name: Upload verified app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoiceInk-v2.13-zip-security-arm64
          path: |
            ${{ runner.temp }}/VoiceInk-v2.13-zip-security-arm64.zip
            ${{ runner.temp }}/VoiceInk-v2.13-zip-security-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 1
